<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061a29">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Tenisovy rozvrh - vyber tydne</title>
<style>
:root{--navy:#061a29;--lime:#b7e43e;}*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(180deg,#041520,#09273a);color:#fff;}
.app{width:min(100%,560px);margin:auto;padding:14px 14px 40px;}
.hero{position:relative;overflow:hidden;padding:38px 28px 34px;border-radius:30px;background:linear-gradient(135deg,#00843f,#003f20);box-shadow:0 15px 34px rgba(0,0,0,.34);}
.hero h1{margin:9px 0 7px;font-size:42px;line-height:.96}.hero p{margin:0;font-size:18px;font-weight:800}.club{font-size:12px;font-weight:900;letter-spacing:1.8px;color:var(--lime);}
.weeks{display:grid;gap:12px;margin-top:16px}.week-card{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:18px 20px;border-radius:22px;background:#fff;color:#102030;text-decoration:none;box-shadow:0 8px 22px rgba(0,0,0,.22);}
.week-card strong{display:block;font-size:23px}.week-card span{display:block;margin-top:3px;color:#52616d;font-weight:700}.week-card .arrow{font-size:34px}.week-card.current{outline:4px solid var(--lime);}
.badge{display:none!important;width:max-content;margin-bottom:6px!important;padding:4px 9px;border-radius:999px;background:var(--lime);color:#153000!important;font-size:11px;font-weight:900;}
.week-card.current .badge{display:inline-block!important;}
.motto{padding:25px 10px;text-align:center;color:var(--lime);font-size:18px;font-weight:900;}
.ride-card{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;margin-top:16px;padding:18px 20px;border-radius:22px;background:linear-gradient(135deg,#7c3aed,#4c1d95);color:#fff;text-decoration:none;box-shadow:0 8px 22px rgba(0,0,0,.25)}.ride-icon{font-size:32px}.ride-card strong{display:block;font-size:20px}.ride-card span{display:block;margin-top:3px;color:#ede9fe;font-weight:700}.ride-arrow{font-size:34px}
</style></head><body><main class="app">
<section class="hero"><div class="club">TK MLADA BOLESLAV</div><h1>TENISOVY<br>ROZVRH</h1><p>JANIK &amp; SIMONKO</p></section>
<a class="ride-card" href="jizdy.html"><div class="ride-icon">&#128663;</div><div><strong>JIZDY &amp; UPOZORNENI</strong><span>Dnesni plan, odjezdy a kalendare</span></div><div class="ride-arrow">&#8250;</div></a>
<section class="weeks">
<a class="week-card" data-week="39" href="tyden39.html"><div><span class="badge">TENTO TYDEN</span><strong>Tyden 39</strong><span>21.9. - 27.9.2026</span></div><div class="arrow">&#8250;</div></a>
<a class="week-card" data-week="40" href="tyden40.html"><div><span class="badge">TENTO TYDEN</span><strong>Tyden 40</strong><span>28.9. - 4.10.2026</span></div><div class="arrow">&#8250;</div></a>
</section>
<div class="motto">Každý trénink je krok vpřed</div>
</main>
<script>
(function(){
function isoWeek(d){
var x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
var day=x.getUTCDay()||7;
x.setUTCDate(x.getUTCDate()+4-day);
var first=new Date(Date.UTC(x.getUTCFullYear(),0,1));
return Math.ceil((((x-first)/86400000)+1)/7);
}
var w=isoWeek(new Date());
document.querySelectorAll('.week-card').forEach(function(card){
card.classList.toggle('current',Number(card.dataset.week)===w);
});
})();
</script>
</body></html>
