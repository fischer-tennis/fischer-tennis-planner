<script>
var RIDES=[{"osoba":"Jan","den":"PO","cas":"12:25","udalost":"Odjezd pro Janíka do školy","trasa":"Práce -\u003e ZŠ Březno -\u003e tenis","auto":"Hyundai","upozornitMin":10,"platnostOd":"2026-11-02","platnostDo":"2027-04-02","poznamka":"NÁVRH: škola do 12:15, oběd min. 20 min; tenis 13:00–14:30"},{"osoba":"Jan","den":"PO","cas":"13:05","udalost":"Návrat do práce po odvozu Janíka","trasa":"Tenis -\u003e práce","auto":"Hyundai","upozornitMin":10,"platnostOd":"2026-11-02","platnostDo":"2027-04-02","poznamka":"NÁVRH času; Janík zůstává na tenise do 14:30"},{"osoba":"Majka","den":"PO","cas":"14:20","udalost":"Vyzvednout Janíka po tenise","trasa":"Tenis -\u003e pro Šimonka","auto":"Passat","upozornitMin":10,"platnostOd":"2026-11-02","platnostDo":"2027-04-02","poznamka":"Potom pokračovat pro Šimonka"},{"osoba":"Majka","den":"PO","cas":"15:00","udalost":"Vyzvednout Šimonka","trasa":"MŠ -\u003e tenis","auto":"Passat","upozornitMin":10,"platnostOd":"2026-11-02","platnostDo":"2027-04-02","poznamka":"NÁVRH času; Šimon má tenis 16:00–17:00"},{"osoba":"Majka","den":"PO","cas":"17:00","udalost":"Odjezd domů po Šimonkově tenise","trasa":"Tenis -\u003e domů","auto":"Passat","upozornitMin":10,"platnostOd":"2026-11-02","platnostDo":"2027-04-02","poznamka":"Janík i Šimon společně domů"},{"osoba":"Majka","den":"UT","cas":"14:00","udalost":"Vyzvednout Janíka ze školy","trasa":"ZŠ Březno -\u003e tenis","auto":"Passat","upozornitMin":10,"platnostOd":"2026-11-02","platnostDo":"2027-04-02","poznamka":"Janík tenis 14:30–16:00"},{"osoba":"Majka","den":"UT","cas":"15:00","udalost":"Odjezd pro Šimonka během Janíkova tréninku","trasa":"Tenis -\u003e MŠ -\u003e tenis","auto":"Passat","upozornitMin":10,"platnostOd":"2026-11-02","platnostDo":"2027-04-02","poznamka":"NÁVRH času; vrátit se před Šimonkovým tenisem"},{"osoba":"Jan","den":"UT","cas":"16:00","udalost":"Janík končí tenis","trasa":"Tenis","auto":"Hyundai","upozornitMin":10,"platnostOd":"2026-11-02","platnostDo":"2027-04-02","poznamka":"Jedu rnitMin":30,"platnostOd":"2026-11-02","platnostDo":"2027-04-02","poznamka":"Vyzvednutí v 17:00"},{"osoba":"Majka","den":"CT","cas":"11:50","udalost":"Vyzvednout Janíka po škole","trasa":"ZŠ Březno -\u003e pro Šimonka","auto":"Passat","upozornitMin":10,"platnostOd":"2026-11-02","platnostDo":"2027-04-02","poznamka":"NÁVRH času; škola do 11:25, potom oběd"},{"osoba":"Majka","den":"CT","cas":"12:30","udalost":"Vyzvednout Šimonka v MŠ","trasa":"MŠ -\u003e tenis","auto":"Passat","upozornitMin":10,"platnostOd":"2026-11-02","platnostDo":"2027-04-02","poznamka":"Janík jede s Majkou; vyzvednutí 12:30–13:00"},{"osoba":"Majka","den":"CT","cas":"14:00","udalost":"Janík - tenis","trasa":"Tenis","auto":"Passat","upozornitMin":10,"platnostOd":"2026-11-02","platnostDo":"2027-04-02","poznamka":"Tenis 14:00–15:20"},{"osoba":"Majka","den":"CT","cas":"16:00","udalost":"Šimonko - tenis","trasa":"Tenis","auto":"Passat","upozornitMin":10,"platnostOd":"2026-11-02","platnostDo":"2027-04-02","poznamka":"Po Janíkově tréninku čekání cca 40 min; Šimon 16:00–17:00"},{"osoba":"Majka","den":"CT","cas":"17:00","udalost":"Odjezd domů po tenise","trasa":"Tenis -\u003e domů","auto":"Passat","upozornitMin":10,"platnostOd":"2026-11-02","platnostDo":"2027-04-02","poznamka":"Všichni společně; ty nejezdíš"},{"osoba":"Majka","den":"PA","cas":"12:30","udalost":"Společně s Janíkem pro Šimonka","trasa":"ZŠ Březno -\u003e MŠ -\u003e tenis","auto":"Passat","upozornitMin":10,"platnostOd":"2026-11-02","platnostDo":"2027-04-02","poznamka":"Vyzvednutí Šimonka 12:30–13:00; potom rychle na Janíkův tenis"},{"osoba":"Majka","den":"PA","cas":"13:00","udalost":"Janík - tenis","trasa":"Tenis","auto":"Passat","upozornitMin":10,"platnostOd":"2026-11-02","platnostDo":"2027-04-02","poznamka":"Tenis 13:00–14:30; Majka + Šimon jedou domů"},{"osoba":"Jan","den":"PA","cas":"14:30","udalost":"Vyzvednout Janíka po tenise","trasa":"Práce -\u003e tenis","auto":"Hyundai","upozornitMin":10,"platnostOd":"2026-11-02","platnostDo":"2027-04-02","poznamka":"Potom Janík šachy v 16:00"},{"osoba":"Jan","den":"PA","cas":"15:40","udalost":"Odjezd s Janíkem na šachy","trasa":"Tenis / domů -\u003e šachy","auto":"Hyundai","upozornitMin":10,"platnostOd":"2026-11-02","platnostDo":"2027-04-02","poznamka":"NÁVRH času; šachy začínají v 16:00"},{"osoba":"Majka","den":"PA","cas":"16:30","udalost":"Odjezd se Šimonkem na tenis","trasa":"Domů -\u003e tenis","auto":"Passat","upozornitMin":10,"platnostOd":"2026-11-02","platnostDo":"2027-04-02","poznamka":"NÁVRH času; Šimon tenis 17:00–18:00"},{"osoba":"Majka","den":"PA","cas":"18:00","udalost":"Odjezd domů po Šimonkově tenise","trasa":"Tenis -\u003e domů","auto":"Passat","upozornitMin":10,"platnostOd":"2026-11-02","platnostDo":"2027-04-02","poznamka":"Šimon končí v 18:00"}];
var filter='all';
try{filter=localStorage.getItem('jizdyFilter')||'all';}catch(e){}
var DAYS={'PO':1,'UT':2,'ST':3,'CT':4,'PA':5,'SO':6,'NE':0};
var DAYN=['Neděle','Pondělí','Úterý','Středa','Čtvrtek','Pátek','Sobota'];
function esc(v){return String(v==null?'':v).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function parseDate(v){if(!v)return null;var p=v.split('-').map(Number);return new Date(p[0],p[1]-1,p[2],0,0,0);}
function ruleValid(r,d){var a=parseDate(r.platnostOd),b=parseDate(r.platnostDo);if(a&&d<a)return false;if(b&&d>b)return false;if(DAYS[r.den]!==d.getDay())return false;return filter==='all'||r.osoba===filter;}
function eventDate(r,d){var p=(r.cas||'00:00').split(':').map(Number);return new Date(d.getFullYear(),d.getMonth(),d.getDate(),p[0]||0,p[1]||0,0);}
function eventHtml(r){var car=r.auto?'<span class="pill">🚗 '+esc(r.auto)+'</span>':'';var rem=r.upozornitMin?'<span class="pill">⏰ -'+esc(r.upozornitMin)+' min</span>':'';return '<div class="ride-event"><div class="rt">'+esc(r.cas)+' · '+esc(r.osoba)+'</div><div class="rtitle">'+esc(r.udalost)+'</div><div class="meta">'+esc(r.trasa||'')+'<br>'+car+rem+(r.poznamka?'<div>'+esc(r.poznamka)+'</div>':'')+'</div></div>';}
function monday(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());var n=x.getDay();var diff=(n===0?-6:1-n);x.setDate(x.getDate()+diff);return x;}
function render(){
 document.querySelectorAll('.ride-filter').forEach(function(b){b.classList.toggle('active',b.dataset.person===filter);});
 var now=new Date(), today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
 var todayItems=RIDES.filter(function(r){return ruleValid(r,today);}).sort(function(a,b){return eventDate(a,today)-eventDate(b,today);});
 document.getElementById('todayRides').innerHTML=todayItems.length?todayItems.map(eventHtml).join(''):'<div class="no-rides"><div><div class="icon">🚗</div><strong>Dnes bez jízd</strong><br><span>V Excelu není pro dnešek žádná platná jízda.</span></div></div>';
 var next=null,nextDt=null;
 for(var i=0;i<21;i++){var d=new Date(today);d.setDate(d.getDate()+i);RIDES.forEach(function(r){if(ruleValid(r,d)){var dt=eventDate(r,d);if(dt>=now&&(!nextDt||dt<nextDt)){next=r;nextDt=dt;}}});}
 document.getElementById('nextRide').innerHTML=next?'<div class="next-time">'+esc(next.cas)+'</div>'+eventHtml(next):'<div class="no-rides"><div><div class="icon">✓</div><strong>Žádná další jízda</strong><br><span>V aktuální platnosti není naplánovaný další odjezd.</span></div></div>';
 var m=monday(today),html='';
 for(var i=0;i<7;i++){var d=new Date(m);d.setDate(d.getDate()+i);var arr=RIDES.filter(function(r){return ruleValid(r,d);}).sort(function(a,b){return eventDate(a,d)-eventDate(b,d);});if(arr.length){html+='<div class="day"><h3>'+DAYN[d.getDay()]+' '+d.getDate()+'.'+(d.getMonth()+1)+'.</h3>'+arr.map(eventHtml).join('')+'</div>';}}
 document.getElementById('weekRides').innerHTML=html||'<div class="no-rides"><div><div class="icon">📅</div><strong>Tento týden bez jízd</strong><br><span>Jakmile budou v listu JIZDY platné záznamy, objeví se zde automaticky.</span></div></div>';
}
document.querySelectorAll('.ride-filter').forEach(function(b){b.addEventListener('click',function(){filter=b.dataset.person;try{localStorage.setItem('jizdyFilter',filter);}catch(e){}render();});});
render();
</script></body></html>
