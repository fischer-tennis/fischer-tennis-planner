<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#13233f"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>Jízdy &amp; upozornění</title></head>
<body><div class="wrap">
<div class="hero"><h1>JÍZDY &amp; UPOZORNĚNÍ</h1><p>Dnešní odjezdy, auta a rodinný plán</p></div>
<div class="nav"><a href="index.html">← Rozvrh</a></div>
<div class="ride-toolbar"><button class="ride-filter" data-person="Jan">JÁ</button><button class="ride-filter" data-person="Majka">MAJKA</button><button class="ride-filter active" data-person="all">VŠICHNI</button></div>
<section class="panel next-panel"><h2>Další událost</h2><div id="nextRide"></div></section>
<section class="panel"><h2>Dnes</h2><div id="todayRides"></div></section>
<section class="panel"><h2>Kalendáře</h2><div class="downloads"><a href="jizdy-jan.ics">📅 JÁ</a><a href="jizdy-majka.ics">📅 MAJKA</a><a href="jizdy-vsichni.ics">📅 VŠICHNI</a></div></section>
<section class="panel"><h2>Upozornění</h2><div class="notice-local">Data pro mobilní upozornění jsou připravena 10 minut před začátkem každého tréninku.</div></section>
<section class="panel"><h2>Týdenní plán</h2><div id="weekRides"></div></section>
<div class="footer">Fischer Tennis Planner V1.0 · jízdy přímo z Excelu</div>
</div>
<script>
var RIDES=[];
var filter='all';
try{filter=localStorage.getItem('jizdyFilter')||'all';}catch(e){}
var DAYS={'PO':1,'UT':2,'ST':3,'CT':4,'PA':5,'SO':6,'NE':0};
var DAYN=['Neděle','Pondělí','Úterý','Středa','Čtvrtek','Pátek','Sobota'];
function esc(v){return String(v==null?'':v).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function parseDate(v){if(!v)return null;var p=v.split('-').map(Number);return new Date(p[0],p[1]-1,p[2],0,0,0);}
function ruleValid(r,d){var a=parseDate(r.platnostOd),b=parseDate(r.platnostDo);if(a&&d<a)return false;if(b&&d>b)return false;if(DAYS[r.den]!==d.getDay())return false;return filter==='all'||r.osoba===filter;}
function eventDate(r,d){var p=(r.cas||'00:00').split(':').map(Number);return new Date(d.getFullYear(),d.getMonth(),d.getDate(),p[0]||0,p[1]||0,0);}
function eventHtml(r){var car=r.auto?'<span class="pill">🚗 '+esc(r.auto)+'</span>':'';var rem=r.upozornitMin?'<span class="pill">⏰ -'+esc(r.upozornitMin)+' min</span>':'';return '<div class="ride-event"><div class="rt">'+esc(r.cas)+' · '+esc(r.osoba)+'</div><div class="rtitle">'+esc(r.udalost)+'</div><div class="meta">'+esc(r.trasa||'')+'<br>'+car+rem+(r.poznamka?'<div>'+esc(r.poznamka)+'</div>':'')+'</div></div>';}
function monday(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());var n=x.getDay();var diff=(n===0?-6:1-n);x.setDate(x.getDate()+diff);return x;}
function render(){
 document.querySelectorAll('.ride-filter').forEach(function(b){b.classList.toggle('active',b.dataset.person===filter);});
 var now=new Date(), today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
 var todayItems=RIDES.filter(function(r){return ruleValid(r,today);}).sort(function(a,b){return eventDate(a,today)-eventDate(b,today);});
 document.getElementById('todayRides').innerHTML=todayItems.length?todayItems.map(eventHtml).join(''):'<div class="no-rides"><div><div class="icon">🚗</div><strong>Dnes bez jízd</strong><br><span>V Excelu není pro dnešek žádná platná jízda.</span></div></div>';
 var next=null,nextDt=null;
 for(var i=0;i<21;i++){var d=new Date(today);d.setDate(d.getDate()+i);RIDES.forEach(function(r){if(ruleValid(r,d)){var dt=eventDate(r,d);if(dt>=now&&(!nextDt||dt<nextDt)){next=r;nextDt=dt;}}});}
 document.getElementById('nextRide').innerHTML=next?'<div class="next-time">'+esc(next.cas)+'</div>'+eventHtml(next):'<div class="no-rides"><div><div class="icon">✓</div><strong>Žádná další jízda</strong><br><span>V aktuální platnosti není naplánovaný další odjezd.</span></div></div>';
 var m=monday(today),html='';
 for(var i=0;i<7;i++){var d=new Date(m);d.setDate(d.getDate()+i);var arr=RIDES.filter(function(r){return ruleValid(r,d);}).sort(function(a,b){return eventDate(a,d)-eventDate(b,d);});if(arr.length){html+='<div class="day"><h3>'+DAYN[d.getDay()]+' '+d.getDate()+'.'+(d.getMonth()+1)+'.</h3>'+arr.map(eventHtml).join('')+'</div>';}}
 document.getElementById('weekRides').innerHTML=html||'<div class="no-rides"><div><div class="icon">📅</div><strong>Tento týden bez jízd</strong><br><span>Jakmile budou v listu JIZDY platné záznamy, objeví se zde automaticky.</span></div></div>';
}
document.querySelectorAll('.ride-filter').forEach(function(b){b.addEventListener('click',function(){filter=b.dataset.person;try{localStorage.setItem('jizdyFilter',filter);}catch(e){}render();});});
render();
</script></body></html>
