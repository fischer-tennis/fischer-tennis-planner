</style></head><body><main class="app">

<section class="panel"><h2>Tydenni plan</h2><div id="weekList"></div></section>
</main><script>
window.OneSignalDeferred=window.OneSignalDeferred||[];let OS=null;OneSignalDeferred.push(async function(OneSignal){OS=OneSignal;await OneSignal.init({appId:'f8592dc4-60de-45e2-85fb-0e54e4003f45',serviceWorkerPath:'/fischer-tennis-planner/OneSignalSDKWorker.js',serviceWorkerParam:{scope:'/fischer-tennis-planner/onesignal-push/'},notifyButton:{enable:false}});updatePushUI();});
const EVENTS=[{person:'Jan',day:1,dayCode:'PO',time:'12:45',title:'Odjezd z prace pro Janika​',route:'Plazy -> Brezno -> Bezdecin',car:'Hyundai',remind:10,from:'2026-09-21',to:'2026-10-02',note:'Janik pred 13:00 ze skoly/druziny'},
{person:'Jan',day:1,dayCode:'PO',time:'13:45',title:'Odjezd z Bezdecina zpet do prace​',route:'Bezdecin -> Plazy',car:'Hyundai',remind:10,from:'2026-09-21',to:'2026-10-02',note:'Janik zustava na tenise 14:00-15:30'},
{person:'Majka',day:1,dayCode:'PO',time:'14:50',title:'Odjezd z prace pro Simonka',route:'Plazy -> Rohatsko -> Bezdecin',car:'Passat',remind:10,from:'2026-09-21',to:'2026-10-02',note:'Simonko je po spanku ve skolce'},
{person:'Jan',day:1,dayCode:'PO',time:'15:30',title:'Vyzvednout Janika po tenise​',route:'Bezdecin -> domu',car:'Hyundai',remind:10,from:'2026-09-21',to:'2026-10-02',note:'Oba kluci domu'},
{person:'Majka',day:2,dayCode:'UT',time:'13:50',title:'Odjezd z prace pro Janika',route:'Plazy -> Brezno -> Bezdecin',car:'Passat',remind:10,from:'2026-09-21',to:'2026-10-02',note:'Janik konci skolu ve 14:00; na tenis muze prijet pozdeji'},
{person:'Majka',day:2,dayCode:'UT',time:'14:20',title:'Vyzvednout Šimonka ve školce',route:'Bezdecin -> Rohatsko',car:'Passat',remind:10,from:'2026-09-21',to:'2026-10-02',note:'Simonko je po spanku ve skolce'},
{person:'Majka',day:2,dayCode:'UT',time:'15:30',title:'Vyzvednout Janika po tenise​',route:'Sportcentrum Bezdecin',car:'Passat',remind:10,from:'2026-09-21',to:'2026-10-02',note:'Zustavaji v Bezdecine na Simonkuv tenis'},
{person:'Majka',day:2,dayCode:'UT',time:'16:00',title:'Simonko - tenis​',route:'Sportcentrum Bezdecin',car:'Passat',remind:30,from:'2026-09-21',to:'2026-10-02',note:'Tenis 16:00-17:00'},
{person:'Jan',day:3,dayCode:'ST',time:'12:45',title:'Odjezd z prace pro Janika',route:'Plazy -> Brezno -> Bezdecin',car:'Hyundai',remind:10,from:'2026-09-21',to:'2026-10-02',note:'Janik pred 13:00 ze skoly/druziny'},
{person:'Jan',day:3,dayCode:'ST',time:'13:45',title:'Odjezd z Bezdecina zpet do prace',route:'Bezdecin -> Plazy',car:'Hyundai',remind:10,from:'2026-09-21',to:'2026-10-02',note:'Janik zustava na tenise 14:00-15:30'},
{person:'Majka',day:3,dayCode:'ST',time:'12:20',title:'Odjezd z prace pro Šimonka',route:'Plazy -> Rohatsko -> domu',car:'Passat',remind:10,from:'2026-09-21',to:'2026-10-02',note:'Šimonko spi doma'},
{person:'Majka',day:3,dayCode:'ST',time:'15:30',title:'Vyzvednout Janika po tenise​',route:'Bezdecin -> Stare Mesto',car:'Passat',remind:30,from:'2026-09-21',to:'2026-10-02',note:'V 16:00 nabozenstvi'},
{person:'Majka',day:3,dayCode:'ST',time:'16:00',title:'Janik - nabozenstvi​',route:'Stare Mesto',car:'Passat',remind:10,from:'2026-09-21',to:'2026-10-02',note:'Majka potom pokracuje se Simonkem na plavani'},
{person:'Majka',day:3,dayCode:'ST',time:'16:30',title:'Odjezd se Simonkem na plavani​',route:'Stare Mesto -> Na Celne 1456',car:'Passat',remind:10,from:'2026-09-21',to:'2026-10-02',note:'Simonko ma plavani od 17:00'},
{person:'Jan',day:3,dayCode:'ST',time:'16:30',title:'Odjezd z prace pro Janika​',route:'Plazy -> Stare Mesto',car:'Hyundai',remind:10,from:'2026-09-21',to:'2026-10-02',note:'V 17:00 vyzvednout Janika z nabozenstvi'},
{person:'Majka',day:3,dayCode:'ST',time:'17:00',title:'Simonko - plavani​',route:'Na Celne 1456, Mlada Boleslav',car:'Passat',remind:10,from:'2026-09-21',to:'2026-10-02',note:'Plavani od 17:00'},
{person:'Majka',day:4,dayCode:'CT',time:'11:50',title:'Vyzvednout Šimonka ve školce',route:'Plazy -> Rohatsko -> domu',car:'Passat',remind:10,from:'2026-09-21',to:'2026-10-02',note:'do skolky pro Simonka'},
{person:'Jan',day:4,dayCode:'CT',time:'12:45',title:'Odjezd z prace pro Janika​',route:'Plazy -> Brezno -> Bezdecin',car:'Hyundai',remind:10,from:'2026-09-21',to:'2026-10-02',note:'Janik pred 13:00 ze skoly/druziny'},
{person:'Jan',day:4,dayCode:'CT',time:'13:45',title:'Odjezd z Bezdecina zpet do prace​',route:'Bezdecin -> Plazy',car:'Hyundai',remind:10,from:'2026-09-21',to:'2026-10-02',note:'Janik zustava na tenise 14:00-15:00'},
{person:'Majka',day:4,dayCode:'CT',time:'15:00',title:'Janik - tenis​',route:'Domu -> Sportcentrum Bezdecin',car:'Passat',remind:30,from:'2026-09-21',to:'2026-10-02',note:'Tenis 14:00-15:00'},
{person:'Majka',day:4,dayCode:'CT',time:'16:00',title:'Simonko - tenis​',route:'Sportcentrum Bezdecin',car:'Passat',remind:10,from:'2026-09-21',to:'2026-10-02',note:'Tenis 16:00-17:00'},
{person:'Majka',day:5,dayCode:'PA',time:'11:50',title:'Odjezd z prace pro deti​',route:'Plazy -> Brezno -> Rohatsko -> domu',car:'Passat',remind:10,from:'2026-09-21',to:'2026-10-02',note:'Oba po obede; bez tenisu'}];
const DAYN=['','Pondeli','Utery','Streda','Ctvrtek','Patek','Sobota','Nedele'];let filter=localStorage.getItem('jizdyFilter')||'all';
function localDate(s){const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2],0,0,0)}function mondayDay(d){let x=d.getDay();return x===0?7:x}function whenToday(e,d){const [h,m]=e.time.split(':').map(Number);return new Date(d.getFullYear(),d.getMonth(),d.getDate(),h,m,0)}function valid(e,d){return d>=localDate(e.from)&&d<=new Date(localDate(e.to).getTime()+86399999)&&mondayDay(d)===e.day&& (filter==='all'||e.person===filter)}
function iconCar(c){return c.toLowerCase().includes('passat')?'&#128663; Passat':'&#128665; Hyundai'}function esc(s){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function eventHTML(e){return `<div class='event person-${e.person}'><div class='etime'>${e.time}</div><div><div class='etitle'>${esc(e.title)}</div><div class='small'>${esc(e.route)}</div><div class='meta'><span class='pill'>${e.person==='Jan'?'JA':'MAJKA'}</span><span class='pill'>${iconCar(e.car)}</span><span class='pill'>&#9200; -${e.remind} min</span></div>${e.note?`<div class='small'>${esc(e.note)}</div>`:''}</div></div>`}
function render(){document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.person===filter));
const now=new Date();const today=EVENTS.filter(e=>valid(e,now)).sort((a,b)=>a.time.localeCompare(b.time));
document.getElementById('todayList').innerHTML=today.length?today.map(eventHTML).join(''):'<div class=empty>Dnes uz neni zadna naplanovana jizda.</div>';
let future=today.map(e=>({e,t:whenToday(e,now)})).filter(x=>x.t>=now).sort((a,b)=>a.t-b.t);let n=document.getElementById('nextContent');
if(future.length){let x=future[0];n.innerHTML=`<div class='next-time'>${x.e.time}</div><div class='next-title'>${esc(x.e.title)}</div><div class='route'>${esc(x.e.route)}</div>`;
n.innerHTML+=`<div class='meta'><span class='pill'>${x.e.person==='Jan'?'JA':'MAJKA'}</span><span class='pill'>${iconCar(x.e.car)}</span></div><div class='count' id='countdown'></div>`;
}else{n.innerHTML='<div class=empty>Pro dnes hotovo &#10003;</div>'}let w='';
for(let d=1;d<=5;d++){let a=EVENTS.filter(e=>e.day===d&&(filter==='all'||e.person===filter)).sort((a,b)=>a.time.localeCompare(b.time));
w+=`<div class='day-title'>${DAYN[d]}</div>`+(a.length?a.map(eventHTML).join(''):'<div class=empty>Bez jizd</div>')}document.getElementById('weekList').innerHTML=w;updateCountdown()}
function updateCountdown(){const el=document.getElementById('countdown');if(!el)return;const now=new Date();const f=EVENTS.filter(e=>valid(e,now)).map(e=>({e,t:whenToday(e,now)})).filter(x=>x.t>=now).sort((a,b)=>a.t-b.t);if(!f.length){el.textContent='';return}let ms=f[0].t-now,hh=Math.floor(ms/3600000),mm=Math.floor((ms%3600000)/60000);el.textContent=hh?`Za ${hh} h ${mm} min`:`Za ${Math.max(0,mm)} min`}
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.person;localStorage.setItem('jizdyFilter',filter);render()});
let pushProfile=localStorage.getItem('pushProfile')||'';function profileId(p){return p==='Majka'?'majka':'jan'}
function updateProfileButtons(){document.querySelectorAll('[data-push-profile]').forEach(b=>b.classList.toggle('active',b.dataset.pushProfile===pushProfile))}
async function updatePushUI(){updateProfileButtons();const st=document.getElementById('pushStatus'),btn=document.getElementById('pushBtn');
if(!OS){st.textContent='OneSignal se nacita...';return}if(!OS.Notifications.isPushSupported()){st.className='push-status warn';st.textContent='Tento prohlizec nepodporuje web push.';btn.disabled=true;return}
let allowed=OS.Notifications.permission;let sid=OS.User&&OS.User.PushSubscription?OS.User.PushSubscription.id:null;
if(allowed&&sid&&pushProfile){st.className='push-status ok';st.textContent='Push je aktivni pro '+(pushProfile==='Jan'?'JA':'MAJKA')+'.';btn.textContent='Push upozorneni jsou zapnuta'}
else if(allowed&&!pushProfile){st.className='push-status warn';st.textContent='Upozorneni jsou povolena, ale vyber JA nebo MAJKA.'}
else{st.className='push-status';st.textContent=pushProfile?'Profil '+(pushProfile==='Jan'?'JA':'MAJKA')+' je vybran. Ted povol upozorneni.':'Nejdriv vyber JA nebo MAJKA.'}}
document.querySelectorAll('[data-push-profile]').forEach(b=>b.onclick=async()=>{pushProfile=b.dataset.pushProfile;localStorage.setItem('pushProfile',pushProfile);updateProfileButtons();if(OS&&OS.Notifications.permission){await OS.login(profileId(pushProfile));OS.User.addTag('person',pushProfile);OS.User.addTag('app','fischer-tennis-planner')}updatePushUI()});
document.getElementById('pushBtn').onclick=async()=>{if(!pushProfile){alert('Nejdriv vyber JA nebo MAJKA.');return}
if(!OS){alert('OneSignal se jeste nacita. Zkus to za chvili znovu.');return}if(!OS.Notifications.isPushSupported()){alert('Tento prohlizec web push nepodporuje.');return}
await OS.login(profileId(pushProfile));OS.User.addTag('person',pushProfile);OS.User.addTag('app','fischer-tennis-planner');await OS.Notifications.requestPermission();
if(OS.Notifications.permission){try{await OS.User.PushSubscription.optIn()}catch(e){}await OS.login(profileId(pushProfile));OS.User.addTag('person',pushProfile);updatePushUI();
alert('Push upozorneni jsou zapnuta pro '+(pushProfile==='Jan'?'JA':'MAJKA')+'.')}else{updatePushUI();alert('Telefon upozorneni nepovolil. Zkontroluj nastaveni prohlizece/aplikace.')}};
render();updateProfileButtons();setInterval(updateCountdown,60000);
if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}))}
</script></body></html>
